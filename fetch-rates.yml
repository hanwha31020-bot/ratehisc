name: Fetch daily rates

on:
  schedule:
    # 매일 KST 오전 7시 (UTC 22:00, 전날) 월~금(KST) 실행
    # cron 요일은 UTC 기준: 일(0)~목(4) 22:00 UTC == 월~금 07:00 KST
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests beautifulsoup4 openpyxl

      - name: Run fetch script
        run: python scripts/fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data/history.json docs/data/history.xlsx
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update rates ($(date +'%Y-%m-%d %H:%M %Z'))"
            git push
          fi
