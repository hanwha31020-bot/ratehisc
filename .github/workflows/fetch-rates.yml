name: Fetch daily rates

on:
  schedule:
    # GitHub Actions의 schedule 트리거는 부하가 몰리면 몇 분~몇 시간, 드물게는
    # 그 회차가 아예 스킵될 수 있다(GitHub 공식 문서에 명시된 한계 - 1시간
    # 간격 4번만 걸어뒀을 때도 특정 회차가 계속 실패/스킵되는 게 관찰됐다).
    # 그래서 새벽 4시부터 30분 간격으로 7시까지 총 7번 같은 작업을 시도한다 -
    # 늦어도 7시까지는 반영되게 하려는 목적. 한 번이라도 먼저 성공하면 이후
    # 시도는 "days"에 실제 변화가 없어 last_run_at도 그대로고 커밋도 안 생긴다
    # (storage.snapshot_days 기반 변경 감지 - 재시도 늘려도 부작용 없음).
    # cron 요일은 UTC 기준: 일(0)~목(4) == 월~금 KST (KST는 UTC+9)
    - cron: "0 19 * * 0-4"   # KST 04:00
    - cron: "30 19 * * 0-4"  # KST 04:30
    - cron: "0 20 * * 0-4"   # KST 05:00
    - cron: "30 20 * * 0-4"  # KST 05:30
    - cron: "0 21 * * 0-4"   # KST 06:00
    - cron: "30 21 * * 0-4"  # KST 06:30
    - cron: "0 22 * * 0-4"   # KST 07:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests beautifulsoup4 openpyxl

      - name: Run fetch script
        run: python scripts/fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data/history.json docs/data/history.xlsx
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update rates ($(date +'%Y-%m-%d %H:%M %Z'))"
            git push
          fi
