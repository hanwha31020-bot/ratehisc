name: Fetch daily rates

on:
  schedule:
    # 매일 KST 오전 6시 (UTC 21:00, 전날) 월~금(KST) 1차 실행
    # cron 요일은 UTC 기준: 일(0)~목(4) 21:00 UTC == 월~금 06:00 KST
    - cron: "0 21 * * 0-4"
    # GitHub Actions의 schedule 트리거는 부하가 몰리면 몇 분~몇십 분,
    # 드물게는 그 회차가 아예 스킵될 수 있다(GitHub 공식 문서에 명시된 한계).
    # 1시간 뒤 KST 7시에 같은 작업을 한 번 더 재시도한다 - 이미 성공했다면
    # git diff에 변경이 없어 "변경 사항 없음"으로 조용히 끝난다.
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests beautifulsoup4 openpyxl

      - name: Run fetch script
        run: python scripts/fetch_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data/history.json docs/data/history.xlsx
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update rates ($(date +'%Y-%m-%d %H:%M %Z'))"
            git push
          fi
