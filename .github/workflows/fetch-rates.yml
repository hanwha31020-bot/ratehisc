name: Fetch daily rates

on:
  schedule:
    # GitHub Actions의 schedule 트리거는 부하가 몰리면 몇 분~몇 시간, 드물게는
    # 그 회차가 아예 스킵될 수 있다(GitHub 공식 문서에 명시된 한계 - 1시간
    # 간격 4번만 걸어뒀을 때도 특정 회차가 계속 실패/스킵되는 게 관찰됐다).
    # 그래서 새벽 3시대부터 30분 간격으로 총 9번 같은 작업을 시도한다 -
    # 늦어도 7시까지는 반영되게 하려는 목적. 실제로 정각/30분 회차가 특히 많이
    # 스킵되고 도는 것도 20~40분씩 밀려서, 분(minute)을 어긋나게 잡고 시작을
    # 앞당겼다. 한 번이라도 먼저 성공하면 이후 시도는 "days"에 실제 변화가 없어
    # last_run_at도 그대로고 커밋도 안 생긴다 (storage.snapshot_days 기반 변경
    # 감지 - 재시도 늘려도 부작용 없음).
    # cron 요일은 UTC 기준: 일(0)~목(4) == 월~금 KST (KST는 UTC+9)
    - cron: "7 18 * * 0-4"   # KST 03:07
    - cron: "37 18 * * 0-4"  # KST 03:37
    - cron: "7 19 * * 0-4"   # KST 04:07
    - cron: "37 19 * * 0-4"  # KST 04:37
    - cron: "7 20 * * 0-4"   # KST 05:07
    - cron: "37 20 * * 0-4"  # KST 05:37
    - cron: "7 21 * * 0-4"   # KST 06:07
    - cron: "37 21 * * 0-4"  # KST 06:37
    - cron: "52 21 * * 0-4"  # KST 06:52
    # 한국자금중개가 전날 저녁에 올린 콜 PDF를 다음 날 아침(07:55~10:16)에 교체하는 날이 있어서,
    # 교체된 값을 반영하려고 오전 10시대에 한 번 더 돈다 (금리 수집은 이미 끝나 있어 변화 없으면 조용히 끝난다).
    # UTC 01:37 = KST 10:37, 월~금(UTC와 KST의 날짜가 같으므로 요일도 같다)
    - cron: "37 1 * * 1-5"   # KST 10:37
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests beautifulsoup4 openpyxl

      - name: Run fetch script
        run: python scripts/fetch_rates.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 콜시작금리: 한국자금중개(KMB) 일일 시황 PDF에서 읽는다 (scripts/fetch_call_start.js).
      # 실패해도 위의 금리 수집 결과는 그대로 커밋되도록 continue-on-error.
      - name: Fetch call start rate (KMB daily PDF)
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund pdf-parse@1.1.1
          node scripts/fetch_call_start.js

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data/history.json docs/data/history.xlsx docs/data/call_start.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: update rates ($(date +'%Y-%m-%d %H:%M %Z'))"
            git push
          fi
