name: Backfill rates (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "채워 넣을 영업일 수 (기본 22 = 약 한 달)"
        required: false
        default: "22"

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir requests beautifulsoup4 openpyxl

      - name: Run backfill script
        run: python scripts/backfill.py --days "${{ github.event.inputs.days }}"

      - name: Commit and push if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add docs/data/history.json docs/data/history.xlsx
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: backfill rates (${{ github.event.inputs.days }} business days)"
            git push
          fi
