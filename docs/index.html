<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>금리 대시보드</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eef2ff;
    --ok: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, "Malgun Gothic", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--text-muted); font-size: 13px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .rate-tile {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: #fafbfc;
  }
  .rate-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .rate-tile .value { font-size: 20px; font-weight: 700; }
  .rate-tile .eff { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .rate-tile.status-blocked .value, .rate-tile.status-no_data .value { color: var(--bad); font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  label { font-size: 13px; color: var(--text-muted); }
  input, select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  button {
    border: none;
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  button:hover { opacity: 0.9; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .badge.ok { background: #dcfce7; color: var(--ok); }
  .badge.warn { background: #fef3c7; color: var(--warn); }
  .badge.bad { background: #fee2e2; color: var(--bad); }
  .summary { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; color: var(--text-muted); }
  .summary b { color: var(--text); }
  footer { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 40px; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
  a.download { text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>금리 대시보드</h1>
    <div class="sub" id="lastUpdated">불러오는 중...</div>
  </header>

  <div class="card">
    <h2>오늘 기준 금리 <span id="todayDateLabel" style="font-weight:400;color:var(--text-muted);"></span></h2>
    <div class="grid" id="todayGrid"></div>
  </div>

  <div class="card">
    <h2>날짜별 조회</h2>
    <div class="row">
      <label for="lookupDate">날짜</label>
      <input type="date" id="lookupDate" />
      <button onclick="doLookup()">조회</button>
    </div>
    <div class="grid" id="lookupGrid"></div>
    <div class="empty" id="lookupEmpty" style="display:none;">해당 날짜의 데이터가 없습니다.</div>
  </div>

  <div class="card">
    <h2>기간별 금리 검색</h2>
    <div class="row">
      <label for="metricSelect">금리 종류</label>
      <select id="metricSelect"></select>
      <label for="startDate">시작일</label>
      <input type="date" id="startDate" />
      <label for="endDate">종료일</label>
      <input type="date" id="endDate" />
      <button onclick="doRangeSearch()">검색</button>
    </div>
    <div class="summary" id="rangeSummary"></div>
    <table id="rangeTable" style="display:none;">
      <thead><tr><th>날짜</th><th>값</th><th>기준일</th><th>상태</th></tr></thead>
      <tbody id="rangeTbody"></tbody>
    </table>
    <div class="empty" id="rangeEmpty" style="display:none;">검색 결과가 없습니다.</div>
  </div>

  <div class="card">
    <h2>엑셀 다운로드</h2>
    <p class="sub" style="margin-top:-6px;">지금까지 누적된 전체 이력을 엑셀 파일로 내려받을 수 있습니다. (매일 자동 갱신)</p>
    <a class="download" href="data/history.xlsx"><button class="secondary">history.xlsx 다운로드</button></a>
  </div>

  <footer>매일 한국시간 오전 7시에 자동 수집됩니다.</footer>
</div>

<script>
const METRIC_LABELS = {
  bok_base: "한국은행 기준금리",
  cd91: "CD(3개월)",
  cp1m: "A1CP(1개월)",
  cp3m: "A1CP(3개월)",
  corp_aa_1y: "회사채(AA-,1년)",
  corp_aa_2y: "회사채(AA-,2년)",
  corp_aa_3y: "회사채(AA-,3년)",
  sofr: "SOFR",
  ust2y: "미국 2년 국채",
};
const STATUS_LABEL = { ok: "정상", blocked: "수집실패", no_data: "데이터없음" };
const STATUS_CLASS = { ok: "ok", blocked: "bad", no_data: "warn" };

let HISTORY = { metrics: Object.keys(METRIC_LABELS), days: {} };

function fmtValue(v) {
  if (v === null || v === undefined || v === "") return "-";
  return Number(v).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
}

function renderTiles(container, dayRecord) {
  container.innerHTML = "";
  if (!dayRecord) return;
  HISTORY.metrics.forEach((m) => {
    const val = dayRecord.values ? dayRecord.values[m] : null;
    const status = dayRecord.status ? dayRecord.status[m] : "no_data";
    const eff = dayRecord.effective_date ? dayRecord.effective_date[m] : null;
    const tile = document.createElement("div");
    tile.className = "rate-tile status-" + status;
    const isBad = status !== "ok";
    tile.innerHTML = `
      <div class="label">${METRIC_LABELS[m]}</div>
      <div class="value">${isBad ? (STATUS_LABEL[status] || "오류") : fmtValue(val) + "%"}</div>
      <div class="eff">${eff ? "기준일 " + eff : ""}${dayRecord.backfilled ? " · 주말백필" : ""}</div>
    `;
    container.appendChild(tile);
  });
}

function latestDay() {
  const keys = Object.keys(HISTORY.days).sort();
  if (keys.length === 0) return null;
  const lastKey = keys[keys.length - 1];
  return { date: lastKey, record: HISTORY.days[lastKey] };
}

function doLookup() {
  const dateStr = document.getElementById("lookupDate").value;
  const grid = document.getElementById("lookupGrid");
  const empty = document.getElementById("lookupEmpty");
  const record = HISTORY.days[dateStr];
  if (!record) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  renderTiles(grid, record);
}

function doRangeSearch() {
  const metric = document.getElementById("metricSelect").value;
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  const tbody = document.getElementById("rangeTbody");
  const table = document.getElementById("rangeTable");
  const emptyEl = document.getElementById("rangeEmpty");
  const summaryEl = document.getElementById("rangeSummary");
  tbody.innerHTML = "";
  summaryEl.innerHTML = "";

  const dates = Object.keys(HISTORY.days)
    .filter((d) => (!start || d >= start) && (!end || d <= end))
    .sort();

  if (dates.length === 0) {
    table.style.display = "none";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";
  table.style.display = "table";

  const values = [];
  dates.forEach((d) => {
    const rec = HISTORY.days[d];
    const val = rec.values ? rec.values[metric] : null;
    const status = rec.status ? rec.status[metric] : "no_data";
    const eff = rec.effective_date ? rec.effective_date[metric] : "";
    if (val !== null && val !== undefined) values.push(val);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d}${rec.backfilled ? " (주말)" : ""}</td>
      <td>${fmtValue(val)}${val !== null && val !== undefined ? "%" : ""}</td>
      <td>${eff || "-"}</td>
      <td><span class="badge ${STATUS_CLASS[status] || "warn"}">${STATUS_LABEL[status] || status}</span></td>
    `;
    tbody.appendChild(tr);
  });

  if (values.length > 0) {
    const min = Math.min(...values);
    const max = Math.max(...values);
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    summaryEl.innerHTML = `
      <div>최소 <b>${fmtValue(min)}%</b></div>
      <div>최대 <b>${fmtValue(max)}%</b></div>
      <div>평균 <b>${fmtValue(avg)}%</b></div>
      <div>데이터 수 <b>${values.length}</b> / ${dates.length}일</div>
    `;
  }
}

async function init() {
  const res = await fetch("data/history.json", { cache: "no-store" });
  HISTORY = await res.json();
  if (!HISTORY.metrics) HISTORY.metrics = Object.keys(METRIC_LABELS);

  const metricSelect = document.getElementById("metricSelect");
  HISTORY.metrics.forEach((m) => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = METRIC_LABELS[m] || m;
    metricSelect.appendChild(opt);
  });

  const last = latestDay();
  if (last) {
    document.getElementById("todayDateLabel").textContent = "(" + last.date + ")";
    renderTiles(document.getElementById("todayGrid"), last.record);
    document.getElementById("lastUpdated").textContent = "마지막 갱신일: " + last.date;
    document.getElementById("lookupDate").value = last.date;
  } else {
    document.getElementById("lastUpdated").textContent = "아직 수집된 데이터가 없습니다.";
  }

  const dates = Object.keys(HISTORY.days).sort();
  if (dates.length > 0) {
    document.getElementById("startDate").value = dates[0];
    document.getElementById("endDate").value = dates[dates.length - 1];
  }
}

init();
</script>
</body>
</html>
